version: '{build}'
image: vs2026-ws2022
clone_depth: 1
max_jobs: 1
branches:
  only:
    - main

# Secrets — set in AppVeyor > Project > Settings > Environment (secure/locked):
#   GH_PAT, APPVEYOR_TOKEN, TAILSCALE_AUTHKEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, RDP_PASSWORD
# APPVEYOR_TOKEN is optional: without it, the box runs one cycle and stops.

environment:
  RDP_USER: rdpuser
  TS_HOSTNAME: bullet-av
  MIGRATION: C:\Migration
  STATE_REPO: moltairsa-code/rdp-state-av
  RUN_MINUTES: '45'
  READY_FLAG: C:\rdp_ready

install:
  - ps: |
      $ErrorActionPreference = "Stop"
      foreach ($n in "GH_PAT","TAILSCALE_AUTHKEY","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID","RDP_PASSWORD") {
        if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))) {
          throw "Required secret $n is empty. Check AppVeyor project environment variables."
        }
      }
      New-Item -ItemType Directory -Force -Path $env:MIGRATION | Out-Null
      New-Item -ItemType Directory -Force -Path "C:\ProgramData\Tailscale" | Out-Null
      Remove-Item $env:READY_FLAG -Force -ErrorAction SilentlyContinue

      # --- restore saved state ---
      $tmp = Join-Path $env:TEMP "state"
      Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
      git clone --depth 1 "https://x-access-token:$env:GH_PAT@github.com/$env:STATE_REPO.git" $tmp 2>&1 | Out-Host
      if ((Test-Path (Join-Path $tmp "state.zip")) -and (Test-Path (Join-Path $tmp ".git"))) {
        $ex = Join-Path $env:TEMP "extract"
        Remove-Item $ex -Recurse -Force -ErrorAction SilentlyContinue
        Expand-Archive -Path (Join-Path $tmp "state.zip") -DestinationPath $ex -Force
        if (Test-Path (Join-Path $ex "migration")) { Copy-Item (Join-Path $ex "migration\*") $env:MIGRATION -Recurse -Force -ErrorAction SilentlyContinue }
        if (Test-Path (Join-Path $ex "tailscale")) { Copy-Item (Join-Path $ex "tailscale\*") "C:\ProgramData\Tailscale" -Recurse -Force -ErrorAction SilentlyContinue }
        Write-Host "State restored."
      } else { Write-Host "No prior state; fresh box." }

      # --- tailscale ---
      $exe = "C:\Program Files\Tailscale\tailscale.exe"
      if (-not (Test-Path $exe)) {
        $dst = Join-Path $env:TEMP "tailscale-setup.exe"
        Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile $dst -UseBasicParsing
        Start-Process $dst -ArgumentList "/quiet" -Wait
      }
      Set-Service Tailscale -StartupType Automatic -ErrorAction SilentlyContinue
      Start-Service Tailscale -ErrorAction SilentlyContinue
      Start-Sleep -Seconds 8
      & $exe up "--authkey=$env:TAILSCALE_AUTHKEY" "--hostname=$env:TS_HOSTNAME" "--accept-routes" "--accept-dns=false"
      if ($LASTEXITCODE -ne 0) { throw "tailscale up failed with exit code $LASTEXITCODE" }
      $ips = @(& $exe ip -4)
      if (-not $ips -or $ips[0] -like "no current*") { throw "Tailscale did not get an IP: $ips" }
      Write-Host "Tailscale IP: $($ips[0])"

      # --- single RDP user + RDP enabled ---
      $u = $env:RDP_USER
      $sec = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
      if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
        New-LocalUser -Name $u -Password $sec -PasswordNeverExpires -AccountNeverExpires | Out-Null
        Start-Sleep -Seconds 2
        Add-LocalGroupMember -Group "Administrators" -Member $u
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
      } else {
        Set-LocalUser -Name $u -Password $sec
        Enable-LocalUser -Name $u
      }
      Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
      Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null
      New-Item -ItemType File -Force -Path $env:READY_FLAG | Out-Null
      Write-Host "Tailscale + RDP ready."

build_script:
  - ps: |
      $ErrorActionPreference = "Continue"
      $exe = "C:\Program Files\Tailscale\tailscale.exe"
      $ip = (& $exe ip -4 | Select-Object -First 1)
      $dns = ((& $exe status --json | ConvertFrom-Json).Self.DNSName).TrimEnd('.')
      $nl = [Environment]::NewLine
      $msg = "AppVeyor RDP UP$nl" + "Host: $dns$nl" + "IP: $ip$nl" + "User: $env:RDP_USER$nl" + "Pass: $env:RDP_PASSWORD$nl" + "Cycle: $env:RUN_MINUTES min, auto-restarts."
      try { Invoke-RestMethod -Method Post -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" -Body @{ chat_id = $env:TELEGRAM_CHAT_ID; text = $msg } | Out-Null } catch {}
      Write-Host $msg
      $end = (Get-Date).AddMinutes([int]$env:RUN_MINUTES)
      while ((Get-Date) -lt $end) { Start-Sleep -Seconds 30 }
      Write-Host "Run window ended."

on_finish:
  - ps: |
      $ErrorActionPreference = "Continue"
      if (-not (Test-Path $env:READY_FLAG)) { Write-Host "Setup did not complete; not saving state or restarting."; return }
      Remove-Item $env:READY_FLAG -Force -ErrorAction SilentlyContinue

      # --- save state ---
      $stage = Join-Path $env:TEMP "stage"
      Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force -Path "$stage\migration" | Out-Null
      New-Item -ItemType Directory -Force -Path "$stage\tailscale" | Out-Null
      Copy-Item "$env:MIGRATION\*" "$stage\migration" -Recurse -Force -ErrorAction SilentlyContinue
      Copy-Item "C:\ProgramData\Tailscale\*" "$stage\tailscale" -Recurse -Force -ErrorAction SilentlyContinue
      $zip = Join-Path $env:TEMP "state.zip"
      Remove-Item $zip -Force -ErrorAction SilentlyContinue
      Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force

      $wd = Join-Path $env:TEMP "push"
      Remove-Item $wd -Recurse -Force -ErrorAction SilentlyContinue
      git clone "https://x-access-token:$env:GH_PAT@github.com/$env:STATE_REPO.git" $wd 2>&1 | Out-Host
      if (Test-Path (Join-Path $wd ".git")) {
        Copy-Item $zip (Join-Path $wd "state.zip") -Force
        git -C $wd config user.email "appveyor@users.noreply.github.com"
        git -C $wd config user.name "appveyor"
        git -C $wd add -A
        git -C $wd commit -m "state $(Get-Date -Format o)" 2>&1 | Out-Host
        git -C $wd push 2>&1 | Out-Host
        if ($LASTEXITCODE -ne 0) { git -C $wd pull --rebase 2>&1 | Out-Host; git -C $wd push 2>&1 | Out-Host }
        Write-Host "State saved."
      } else { Write-Host "State repo clone failed; skipping save." }

      # --- auto-restart (v2 token needs /api/account/{account} prefix) ---
      if ($env:APPVEYOR_TOKEN) {
        $body = @{ accountName = $env:APPVEYOR_ACCOUNT_NAME; projectSlug = $env:APPVEYOR_PROJECT_SLUG; branch = "main" } | ConvertTo-Json
        $headers = @{ Authorization = "Bearer $env:APPVEYOR_TOKEN" }
        try {
          Invoke-RestMethod -Method Post -Uri "https://ci.appveyor.com/api/account/$env:APPVEYOR_ACCOUNT_NAME/builds" -Headers $headers -ContentType "application/json" -Body $body | Out-Null
          Write-Host "Next build triggered."
        } catch { Write-Host "Trigger failed: $_" }
      } else { Write-Host "APPVEYOR_TOKEN not set - not restarting." }
