version: '{build}'
image: vs2026-ws2022
clone_depth: 1
max_jobs: 1
branches:
  only:
    - main

# Secrets — set in AppVeyor > Project > Settings > Environment (secure/locked):
#   GH_PAT, APPVEYOR_TOKEN, TAILSCALE_AUTHKEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, RDP_PASSWORD
# APPVEYOR_TOKEN is optional: without it, the box runs one cycle and stops.

environment:
  RDP_USER: rdpuser
  TS_HOSTNAME: bullet-av-1
  MIGRATION: C:\Migration
  STATE_REPO: moltairsa-code/rdp-state-av
  RUN_MINUTES: '45'
  READY_FLAG: C:\rdp_ready

install:
  - ps: |
      $ErrorActionPreference = "Continue"
      foreach ($n in "GH_PAT","TAILSCALE_AUTHKEY","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID","RDP_PASSWORD") {
        if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))) {
          throw "Required secret $n is empty. Check AppVeyor project environment variables."
        }
      }
      New-Item -ItemType Directory -Force -Path $env:MIGRATION | Out-Null
      New-Item -ItemType Directory -Force -Path "C:\ProgramData\Tailscale" | Out-Null
      Remove-Item $env:READY_FLAG -Force -ErrorAction SilentlyContinue

      # --- restore saved state ---
      $tmp = Join-Path $env:TEMP "state"
      Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
      git clone --depth 1 "https://x-access-token:$env:GH_PAT@github.com/$env:STATE_REPO.git" $tmp 2>&1 | Out-Host
      if (-not (Test-Path (Join-Path $tmp ".git"))) { throw "State repo clone failed (check GH_PAT / STATE_REPO)" }
      if (Test-Path (Join-Path $tmp "state.zip")) {
        $ex = Join-Path $env:TEMP "extract"
        Remove-Item $ex -Recurse -Force -ErrorAction SilentlyContinue
        Expand-Archive -Path (Join-Path $tmp "state.zip") -DestinationPath $ex -Force
        if (Test-Path (Join-Path $ex "migration")) { Copy-Item (Join-Path $ex "migration\*") $env:MIGRATION -Recurse -Force -ErrorAction SilentlyContinue }
        if (Test-Path (Join-Path $ex "tailscale")) { Copy-Item (Join-Path $ex "tailscale\*") "C:\ProgramData\Tailscale" -Recurse -Force -ErrorAction SilentlyContinue }
        Write-Host "State restored."
      } else { Write-Host "No prior state; fresh box." }

      # --- tailscale ---
      $exe = "C:\Program Files\Tailscale\tailscale.exe"
      if (-not (Test-Path $exe)) {
        $dst = Join-Path $env:TEMP "tailscale-setup.exe"
        Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile $dst -UseBasicParsing
        if (-not (Test-Path $dst)) { throw "Tailscale installer download failed" }
        Start-Process $dst -ArgumentList "/quiet" -Wait
      }
      if (-not (Test-Path $exe)) { throw "Tailscale not installed" }
      Set-Service Tailscale -StartupType Automatic -ErrorAction SilentlyContinue
      Start-Service Tailscale -ErrorAction SilentlyContinue
      Start-Sleep -Seconds 8
      & $exe up "--authkey=$env:TAILSCALE_AUTHKEY" "--hostname=$env:TS_HOSTNAME" "--accept-routes" "--accept-dns=false" 2>&1 | Out-Host
      if ($LASTEXITCODE -ne 0) { throw "tailscale up failed with exit code $LASTEXITCODE" }
      $ips = @(& $exe ip -4)
      if (-not $ips -or $ips[0] -like "no current*") { throw "Tailscale did not get an IP: $ips" }
      Write-Host "Tailscale IP: $($ips[0])"

      # --- single RDP user + RDP enabled ---
      $u = $env:RDP_USER
      $sec = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
      if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
        New-LocalUser -Name $u -Password $sec -PasswordNeverExpires -AccountNeverExpires | Out-Null
        Start-Sleep -Seconds 2
        Add-LocalGroupMember -Group "Administrators" -Member $u
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
      } else {
        Set-LocalUser -Name $u -Password $sec
        Enable-LocalUser -Name $u
      }
      if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) { throw "RDP user $u was not created" }
      Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
      Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null

      # --- Xray VLESS+WS backend (public via Tailscale Funnel; TLS terminated by tailscaled) ---
      $xdir = Join-Path $env:MIGRATION "xray"
      New-Item -ItemType Directory -Force -Path $xdir | Out-Null
      $xray = Join-Path $xdir "xray.exe"
      if (-not (Test-Path $xray)) {
        Write-Host "Downloading Xray-core..."
        $zip = Join-Path $env:TEMP "xray.zip"
        Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile $zip -UseBasicParsing
        if (-not (Test-Path $zip)) { throw "Xray download failed" }
        Expand-Archive -Path $zip -DestinationPath $xdir -Force
      }
      if (-not (Test-Path $xray)) { throw "Xray extract failed" }

      $uuidFile = Join-Path $xdir "uuid.txt"
      $pathFile = Join-Path $xdir "wspath.txt"
      if ([string]::IsNullOrWhiteSpace($env:PROXY_UUID)) {
        if (-not (Test-Path $uuidFile)) { [guid]::NewGuid().ToString() | Set-Content -Path $uuidFile -Encoding ASCII }
        $uuid = (Get-Content $uuidFile -Raw).Trim()
      } else { $uuid = $env:PROXY_UUID; $uuid | Set-Content -Path $uuidFile -Encoding ASCII }
      if ([string]::IsNullOrWhiteSpace($env:PROXY_PATH)) {
        if (-not (Test-Path $pathFile)) { ("/" + [guid]::NewGuid().ToString("N").Substring(0,12)) | Set-Content -Path $pathFile -Encoding ASCII }
        $wspath = (Get-Content $pathFile -Raw).Trim()
      } else { $wspath = $env:PROXY_PATH; $wspath | Set-Content -Path $pathFile -Encoding ASCII }

      $cfg = [ordered]@{
        log = @{ loglevel = "warning" }
        inbounds = @(@{
          listen = "0.0.0.0"; port = 8080; protocol = "vless"
          settings = @{ clients = @(@{ id = $uuid; email = "user" }); decryption = "none" }
          streamSettings = @{ network = "ws"; wsSettings = @{ path = $wspath } }
        })
        outbounds = @(@{ protocol = "freedom" })
      }
      $json = $cfg | ConvertTo-Json -Depth 10
      [System.IO.File]::WriteAllText((Join-Path $xdir "config.json"), $json, (New-Object System.Text.UTF8Encoding($false)))

      try { Unblock-File -Path $xray -ErrorAction SilentlyContinue } catch {}
      try { Add-MpPreference -ExclusionPath $xdir -ErrorAction SilentlyContinue } catch {}
      $ver = (& $xray version 2>&1 | Out-String)
      Write-Host "Xray version: $($ver.Trim())"

      $stdout = Join-Path $xdir "xray.out.log"
      $stderr = Join-Path $xdir "xray.err.log"
      Get-Process xray -ErrorAction SilentlyContinue | Stop-Process -Force
      $p = Start-Process -FilePath $xray -ArgumentList "run","-c",(Join-Path $xdir "config.json") -WorkingDirectory $xdir -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
      Start-Sleep -Seconds 3
      $p.Refresh()
      if ($p.HasExited) {
        Write-Host "Xray exited with code $($p.ExitCode)"
        Write-Host "--- xray stderr ---"; Get-Content $stderr -ErrorAction SilentlyContinue | Out-Host
        Write-Host "--- xray stdout ---"; Get-Content $stdout -ErrorAction SilentlyContinue | Out-Host
        Write-Host "--- config ---"; Get-Content (Join-Path $xdir "config.json") -ErrorAction SilentlyContinue | Out-Host
        throw "Xray did not start"
      }
      Write-Host "Xray VLESS+WS on 0.0.0.0:8080$wspath"

      # Funnel: run detached. First run prints a one-time approval URL and may wait for it.
      $fout = Join-Path $xdir "funnel.out.log"
      $ferr = Join-Path $xdir "funnel.err.log"
      Start-Process -FilePath $exe -ArgumentList "funnel","--bg","--yes","--https=443","localhost:8080" -WindowStyle Hidden -RedirectStandardOutput $fout -RedirectStandardError $ferr
      Start-Sleep -Seconds 12
      $ftext = ""
      if (Test-Path $fout) { $ftext += (Get-Content $fout -Raw -ErrorAction SilentlyContinue) }
      if (Test-Path $ferr) { $ftext += (Get-Content $ferr -Raw -ErrorAction SilentlyContinue) }
      Write-Host $ftext
      $ftext | Set-Content -Path (Join-Path $xdir "funnel.log") -Encoding ASCII

      # --- Cloudflare quick tunnel (public HTTPS+WS now; URL rotates per cycle until Funnel/ngrok) ---
      $cfdir = Join-Path $env:MIGRATION "cf"
      New-Item -ItemType Directory -Force -Path $cfdir | Out-Null
      $cf = Join-Path $cfdir "cloudflared.exe"
      if (-not (Test-Path $cf)) {
        Write-Host "Downloading cloudflared..."
        Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cf -UseBasicParsing
      }
      try { Unblock-File -Path $cf -ErrorAction SilentlyContinue } catch {}
      Get-Process cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force
      $cflog = Join-Path $cfdir "cf.log"
      $cferr = Join-Path $cfdir "cf.err.log"
      Start-Process -FilePath $cf -ArgumentList "tunnel","--url","http://127.0.0.1:8080","--no-autoupdate" -WorkingDirectory $cfdir -WindowStyle Hidden -RedirectStandardOutput $cflog -RedirectStandardError $cferr
      Start-Sleep -Seconds 12
      $cftext = ""
      foreach ($lf in @($cflog,$cferr)) { if (Test-Path $lf) { $cftext += (Get-Content $lf -Raw -ErrorAction SilentlyContinue) } }
      $cfurl = ([regex]::Match($cftext, "https://[a-z0-9-]+\.trycloudflare\.com")).Value
      if ($cfurl) { Write-Host "Cloudflare tunnel: $cfurl" } else { Write-Host "Cloudflare tunnel URL not found yet (see $cflog)" }

      New-Item -ItemType File -Force -Path $env:READY_FLAG | Out-Null
      Write-Host "Tailscale + RDP + Xray ready."

build_script:
  - ps: |
      $ErrorActionPreference = "Continue"
      $exe = "C:\Program Files\Tailscale\tailscale.exe"
      $ip = (& $exe ip -4 | Select-Object -First 1)
      $dns = ((& $exe status --json | ConvertFrom-Json).Self.DNSName).TrimEnd('.')
      $nl = [Environment]::NewLine
      $msg = "AppVeyor RDP UP$nl" + "Host: $dns$nl" + "IP: $ip$nl" + "User: $env:RDP_USER$nl" + "Pass: $env:RDP_PASSWORD$nl" + "Cycle: $env:RUN_MINUTES min, auto-restarts."

      $xdir = Join-Path $env:MIGRATION "xray"
      $uuid = if (Test-Path (Join-Path $xdir "uuid.txt")) { (Get-Content (Join-Path $xdir "uuid.txt") -Raw).Trim() } else { "" }
      $wspath = if (Test-Path (Join-Path $xdir "wspath.txt")) { (Get-Content (Join-Path $xdir "wspath.txt") -Raw).Trim() } else { "" }
      $cftext = ""
      foreach ($lf in @((Join-Path $env:MIGRATION "cf\cf.log"),(Join-Path $env:MIGRATION "cf\cf.err.log"))) {
        if (Test-Path $lf) { $cftext += (Get-Content $lf -Raw -ErrorAction SilentlyContinue) }
      }
      $cfurl = ([regex]::Match($cftext, "https://[a-z0-9-]+\.trycloudflare\.com")).Value

      if ($uuid -and $wspath) {
        $msg += "$nl$nl--- proxy (VLESS + WS + TLS) ---$nl" + "addr: $dns$nl" + "port: 443$nl" + "id: $uuid$nl" + "path: $wspath$nl" + "sni/host: $dns$nl" + "network: ws, tls: true"
        $info = @{ funnel = @{ host = $dns; port = 443; id = $uuid; path = $wspath; sni = $dns; network = "ws"; tls = $true } }
        if ($cfurl) {
          $cfhost = $cfurl -replace '^https://',''
          $info["cloudflare"] = @{ host = $cfhost; port = 443; id = $uuid; path = $wspath; sni = $cfhost; network = "ws"; tls = $true }
          $msg += "$nl$nl--- proxy (Cloudflare quick tunnel, URL rotates) ---$nl" + "addr: $cfhost$nl" + "port: 443$nl" + "id: $uuid$nl" + "path: $wspath$nl" + "sni/host: $cfhost$nl" + "network: ws, tls: true"
        }
        [System.IO.File]::WriteAllText((Join-Path $env:MIGRATION "proxy.json"), ($info | ConvertTo-Json -Depth 5), (New-Object System.Text.UTF8Encoding($false)))
      }

      $fstat = (& $exe funnel status --json 2>&1 | Out-String)
      if ($fstat -notmatch "8080") {
        $ftext = ""
        foreach ($lf in @("funnel.out.log","funnel.err.log")) {
          $lp = Join-Path $xdir $lf
          if (Test-Path $lp) { $ftext += (Get-Content $lp -Raw -ErrorAction SilentlyContinue) }
        }
        if ($ftext -match "login\.tailscale\.com") { $msg += "$nl$nlFUNNEL APPROVAL NEEDED (open once):$nl$ftext" }
        else {
          Start-Process -FilePath $exe -ArgumentList "funnel","--bg","--yes","--https=443","localhost:8080" -WindowStyle Hidden -RedirectStandardOutput (Join-Path $xdir "funnel-retry.out.log") -RedirectStandardError (Join-Path $xdir "funnel-retry.err.log")
        }
      }

      try { Invoke-RestMethod -Method Post -Uri "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage" -Body @{ chat_id = $env:TELEGRAM_CHAT_ID; text = $msg } | Out-Null } catch {}
      Write-Host $msg

      $end = (Get-Date).AddMinutes([int]$env:RUN_MINUTES)
      $funnelLogged = $false
      $i = 0
      while ((Get-Date) -lt $end) {
        if ($i % 4 -eq 0) {
          $fstat = (& $exe funnel status --json 2>&1 | Out-String)
          if ($fstat -match "8080") {
            if (-not $funnelLogged) { Write-Host "Funnel active: https://$dns"; $funnelLogged = $true }
          } else {
            $fout2 = Join-Path $xdir "funnel-retry-$i.out.log"
            $ferr2 = Join-Path $xdir "funnel-retry-$i.err.log"
            Start-Process -FilePath $exe -ArgumentList "funnel","--bg","--yes","--https=443","localhost:8080" -WindowStyle Hidden -RedirectStandardOutput $fout2 -RedirectStandardError $ferr2
            Start-Sleep -Seconds 3
            $ftext = ""
            if (Test-Path $fout2) { $ftext += (Get-Content $fout2 -Raw -ErrorAction SilentlyContinue) }
            if (Test-Path $ferr2) { $ftext += (Get-Content $ferr2 -Raw -ErrorAction SilentlyContinue) }
            if ($ftext -match "login\.tailscale\.com") { Write-Host "FUNNEL APPROVAL NEEDED: $ftext" }
          }
        }
        $i++
        Start-Sleep -Seconds 30
      }
      Write-Host "Run window ended."

on_finish:
  - ps: |
      $ErrorActionPreference = "Continue"
      if (-not (Test-Path $env:READY_FLAG)) { Write-Host "Setup did not complete; not saving state or restarting."; return }
      Remove-Item $env:READY_FLAG -Force -ErrorAction SilentlyContinue

      # --- save state ---
      $stage = Join-Path $env:TEMP "stage"
      Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force -Path "$stage\migration" | Out-Null
      New-Item -ItemType Directory -Force -Path "$stage\tailscale" | Out-Null
      Copy-Item "$env:MIGRATION\*" "$stage\migration" -Recurse -Force -ErrorAction SilentlyContinue
      Copy-Item "C:\ProgramData\Tailscale\*" "$stage\tailscale" -Recurse -Force -ErrorAction SilentlyContinue
      # keep repo small: binaries are re-downloaded, only config/keys/UUID persist
      Remove-Item "$stage\migration\xray\xray.exe" -Force -ErrorAction SilentlyContinue
      Remove-Item "$stage\migration\xray\*.dat" -Force -ErrorAction SilentlyContinue
      Remove-Item "$stage\migration\cf\cloudflared.exe" -Force -ErrorAction SilentlyContinue
      $zip = Join-Path $env:TEMP "state.zip"
      Remove-Item $zip -Force -ErrorAction SilentlyContinue
      Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force

      $wd = Join-Path $env:TEMP "push"
      Remove-Item $wd -Recurse -Force -ErrorAction SilentlyContinue
      git clone "https://x-access-token:$env:GH_PAT@github.com/$env:STATE_REPO.git" $wd 2>&1 | Out-Host
      if (Test-Path (Join-Path $wd ".git")) {
        Copy-Item $zip (Join-Path $wd "state.zip") -Force
        if (Test-Path (Join-Path $env:MIGRATION "proxy.json")) { Copy-Item (Join-Path $env:MIGRATION "proxy.json") (Join-Path $wd "proxy.json") -Force }
        git -C $wd config user.email "appveyor@users.noreply.github.com"
        git -C $wd config user.name "appveyor"
        git -C $wd add -A
        git -C $wd commit -m "state $(Get-Date -Format o)" 2>&1 | Out-Host
        git -C $wd push 2>&1 | Out-Host
        if ($LASTEXITCODE -ne 0) { git -C $wd pull --rebase 2>&1 | Out-Host; git -C $wd push 2>&1 | Out-Host }
        Write-Host "State saved."
      } else { Write-Host "State repo clone failed; skipping save." }

      # --- auto-restart (v2 token needs /api/account/{account} prefix) ---
      if ($env:APPVEYOR_TOKEN) {
        $body = @{ accountName = $env:APPVEYOR_ACCOUNT_NAME; projectSlug = $env:APPVEYOR_PROJECT_SLUG; branch = "main" } | ConvertTo-Json
        $headers = @{ Authorization = "Bearer $env:APPVEYOR_TOKEN" }
        try {
          Invoke-RestMethod -Method Post -Uri "https://ci.appveyor.com/api/account/$env:APPVEYOR_ACCOUNT_NAME/builds" -Headers $headers -ContentType "application/json" -Body $body | Out-Null
          Write-Host "Next build triggered."
        } catch { Write-Host "Trigger failed: $_" }
      } else { Write-Host "APPVEYOR_TOKEN not set - not restarting." }
